<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Property Details | CBD OPS</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- PROPERTY DETAILS OVERRIDES -->
    <style>

        /* =========================================
           HEADER
        ========================================= */

        .site-header {
            width: 100%;
            background: #111111;
            position: relative;
            z-index: 1000;
        }

        .site-header .container {
            max-width: 1180px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .nav-container {
            min-height: 82px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 30px;
        }


        /* =========================================
           LOGO
        ========================================= */

        .site-header .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            flex-shrink: 0;
        }

        .site-header .logo img {
            width: 48px !important;
            height: 48px !important;
            max-width: 48px !important;
            max-height: 48px !important;
            object-fit: contain;
            display: block;
        }

        .site-header .logo span {
            color: white;
            font-size: 23px;
            font-weight: 800;
            white-space: nowrap;
        }

        .site-header .logo strong {
            color: #d4af55;
        }


        /* =========================================
           NAVIGATION
        ========================================= */

        .site-header .nav-links {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 30px;
            margin-left: auto;
        }

        .site-header .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            white-space: nowrap;
        }

        .site-header .nav-links a:hover {
            color: #d4af55;
        }

        .site-header .nav-links a.active {
            color: #d4af55;
        }


        /* =========================================
           GOLD BUTTON
        ========================================= */

        .site-header .btn-gold {
            background: #d4af55;
            color: #111111 !important;
            padding: 16px 24px;
            border-radius: 6px;
            font-weight: 700;
        }

        .site-header .btn-gold:hover {
            background: #e0bd67;
            color: #111111 !important;
        }


        /* =========================================
           PROPERTY PAGE
        ========================================= */

        .property-details {
            padding: 70px 0 100px;
            background: #ffffff;
        }

        .property-details > .container {
            max-width: 1180px;
            margin: 0 auto;
            padding: 0 24px;
        }


        /* =========================================
           PROPERTY TITLE
        ========================================= */

        .property-details .eyebrow {
            margin-bottom: 15px;
        }

        .property-details h1 {
            margin: 0 0 15px;
        }

        .property-details #propertyStatus {
            font-weight: 600;
            margin-bottom: 8px;
        }

        .property-details #propertyLocation {
            margin-bottom: 15px;
        }

        .property-details #propertyPrice {
            margin-bottom: 35px;
        }


        /* =========================================
           MAIN IMAGE
        ========================================= */

        .property-main-image {
            width: 100%;
            max-width: 960px;
            margin: 0 auto 25px;
            overflow: hidden;
            border-radius: 10px;
        }

        .property-main-image img {
            display: block;
            width: 100%;
            height: 500px;
            object-fit: cover;
            border-radius: 10px;
        }


        /* =========================================
           GALLERY
        ========================================= */

        .property-gallery {
            max-width: 960px;
            margin: 0 auto 50px;

            display: grid;
            grid-template-columns:
                repeat(4, 1fr);

            gap: 15px;
        }

        .property-gallery img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            display: block;
        }

        .property-gallery img:hover {
            opacity: 0.85;
        }


        /* =========================================
           FEATURES
        ========================================= */

        .property-features {
            max-width: 960px;
            margin: 0 auto 50px;

            display: grid;
            grid-template-columns:
                repeat(3, 1fr);

            gap: 20px;
        }

        .property-features p {
            margin: 0;
            padding: 22px;
            background: #f8f8f8;
            border: 1px solid #e4e4e4;
            border-radius: 8px;
            font-weight: 600;
        }

        .property-features span {
            font-weight: 700;
        }


        /* =========================================
           DESCRIPTION
        ========================================= */

        .property-description {
            max-width: 960px;
            margin: 0 auto 40px;
        }

        .property-description h2 {
            margin-bottom: 15px;
        }

        .property-description p {
            line-height: 1.8;
        }


        /* =========================================
           CONTACT BUTTON
        ========================================= */

        .property-details .btn-gold {
            display: inline-block;
            background: #d4af55;
            color: #111111;
            text-decoration: none;
            padding: 15px 28px;
            border-radius: 6px;
            font-weight: 700;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 800px) {

            .nav-container {
                flex-direction: column;
                padding-top: 15px;
                padding-bottom: 15px;
            }

            .site-header .nav-links {
                flex-wrap: wrap;
                justify-content: center;
                gap: 18px;
                margin-left: 0;
            }

            .property-details {
                padding-top: 40px;
            }

            .property-details h1 {
                font-size: 38px;
            }

            .property-main-image img {
                height: 350px;
            }

            .property-gallery {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .property-features {
                grid-template-columns:
                    1fr;
            }

        }


        @media (max-width: 500px) {

            .site-header .logo img {
                width: 42px !important;
                height: 42px !important;
                max-width: 42px !important;
                max-height: 42px !important;
            }

            .site-header .logo span {
                font-size: 20px;
            }

            .property-details h1 {
                font-size: 32px;
            }

            .property-main-image img {
                height: 280px;
            }

            .property-gallery {
                grid-template-columns:
                    1fr 1fr;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         NAVIGATION
    ========================================== -->

    <header class="site-header">

        <div class="container nav-container">

            <a
                href="index.html"
                class="logo"
            >

                <img
                    src="Images/Logo.png"
                    alt="CBD OPS Logo"
                >

                <span>
                    CBD <strong>OPS</strong>
                </span>

            </a>


            <nav class="nav-links">

                <a href="index.html">
                    Home
                </a>

                <a
                    href="properties.html"
                    class="active"
                >
                    Properties
                </a>

                <a href="about.html">
                    About Us
                </a>

                <a href="contact.html">
                    Contact
                </a>

                <a
                    href="list-property.html"
                    class="btn btn-gold"
                >
                    List Your Property
                </a>

            </nav>

        </div>

    </header>


    <!-- =========================================
         PROPERTY DETAILS
    ========================================== -->

    <main class="property-details">

        <div class="container">

            <p class="eyebrow gold-text">
                PROPERTY DETAILS
            </p>


            <h1 id="propertyTitle">
                Loading property...
            </h1>


            <p id="propertyStatus"></p>


            <p id="propertyLocation"></p>


            <h2 id="propertyPrice"></h2>


            <!-- MAIN IMAGE -->

            <div class="property-main-image">

                <img
                    id="mainImage"
                    src=""
                    alt="Property image"
                >

            </div>


            <!-- GALLERY -->

            <div class="property-gallery">

                <img
                    id="gallery1"
                    src=""
                    alt="Property image 1"
                >

                <img
                    id="gallery2"
                    src=""
                    alt="Property image 2"
                >

                <img
                    id="gallery3"
                    src=""
                    alt="Property image 3"
                >

                <img
                    id="gallery4"
                    src=""
                    alt="Property image 4"
                >

            </div>


            <!-- FEATURES -->

            <div class="property-features">

                <p>
                    🛏️ Bedrooms:
                    <span id="bedrooms">-</span>
                </p>

                <p>
                    🚿 Bathrooms:
                    <span id="bathrooms">-</span>
                </p>

                <p>
                    🚗 Garages:
                    <span id="garages">-</span>
                </p>

            </div>


            <!-- DESCRIPTION -->

            <div class="property-description">

                <h2>
                    Property Description
                </h2>

                <p id="description">
                    Loading property information...
                </p>

            </div>


            <!-- CONTACT -->

            <a
                href="contact.html"
                class="btn btn-gold"
            >
                Contact Us
            </a>

        </div>

    </main>


    <!-- JAVASCRIPT -->

    <script src="js/script.js"></script>

</body>

</html>
